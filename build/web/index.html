<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="khadematy_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>khadematy_web</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/'
        }).then(function (registration) {
          console.log('Firebase Service Worker registered with scope: ', registration.scope);
        }).catch(function (err) {
          console.log('Firebase Service Worker registration note: ', err);
        });
      });
    }

    (function () {
      var sharedCtx = null;

      function getUnlockedAudioContext() {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!sharedCtx) {
          sharedCtx = new AudioCtx();
        }
        if (sharedCtx.state === 'suspended') {
          sharedCtx.resume().catch(function () {});
        }
        return sharedCtx;
      }

      // تفعيل سياق الصوت تلقائياً عند أول تفاعل للمستخدم مع الصفحة (نقر أو ضغط مفتاح)
      ['click', 'pointerdown', 'keydown', 'touchstart'].forEach(function (evtName) {
        window.addEventListener(evtName, function () {
          getUnlockedAudioContext();
        }, { passive: true });
      });

      window.khadematyPlayChime = function () {
        try {
          var ctx = getUnlockedAudioContext();
          if (!ctx) return false;

          var triggerTones = function () {
            var now = ctx.currentTime;
            function playTone(freq, startOffset, duration) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + startOffset);
              gain.gain.setValueAtTime(0.001, now + startOffset);
              gain.gain.exponentialRampToValueAtTime(0.35, now + startOffset + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.001, now + startOffset + duration);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + startOffset);
              osc.stop(now + startOffset + duration);
            }
            // نغمة جرس تنبيه ثنائية واضحة (D5 -> A5)
            playTone(587.33, 0.0, 0.25);
            playTone(880.00, 0.13, 0.38);
          };

          if (ctx.state === 'suspended') {
            ctx.resume().then(triggerTones).catch(function (e) {
              console.warn('Khadematy audio resume blocked until interaction:', e);
            });
          } else {
            triggerTones();
          }
          return true;
        } catch (e) {
          console.warn('Khadematy audio chime error:', e);
          return false;
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
